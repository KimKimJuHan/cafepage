<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카페 홈</title>
  <link rel="stylesheet" href="./common.css">
  <link rel="stylesheet" href="./index.css">
  <script defer src="./common.js"></script>
  <script defer src="./index.js"></script>
</head>
<body>
  <header id="header"></header>

  <main>
    <section class="banner">
      <h1>카페이름이 시리즈</h1>
      <p>저희 카페이름은 어떻게 이런식일까요</p>
      <a href="menu.html" class="btn">메뉴 보기</a>
    </section>

    <section class="content">
      <h2 class="title">추천 메뉴</h2>
      <div class="card-list">
        <div class="card">
          <div class="photo">사진</div>
          <div class="info">
            <h3>차가운 아침</h3>
            <p>추울때 먹는겁니다</p>
            <div class="price">9,000원</div>
          </div>
        </div>
        <div class="card">
          <div class="photo">사진</div>
          <div class="info">
            <h3>뜨거운 여름</h3>
            <p>아 뜨거</p>
            <div class="price">8,000원</div>
          </div>
        </div>
        <div class="card">
          <div class="photo">사진</div>
          <div class="info">
            <h3>락스 온 더 락</h3>
            <p>바텐더. 늘 먹던 걸로.</p>
            <div class="price">4,444원</div>
          </div>
        </div>
        <div class="card">
          <div class="photo">사진</div>
          <div class="info">
            <h3>쓸쓸함</h3>
            <p>내 쓸쓸함은 오천원을 넘지 않아</p>
            <div class="price">3,000원</div>
          </div>
        </div>
      </div>

      <h2 class="title intro-title">카페 소개</h2>
      <div class="intro">
        <div class="intro-photo">매장 사진</div>
        <div class="intro-text">
          <p>저희 카페이름이 어떻게는 이름이 카페이름이 어떻게 입니다</p>
          <p> 운영 시간 ㅣ 09:00 ~ 21:00 </p>
          <table>
            <tr>
              <th>매장 수</th>
              <th>메뉴 수</th>
              <th>좌석 수</th>
            </tr>
            <tr>
              <td>02개</td>
              <td>06개</td>
              <td>28석</td>
            </tr>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>
</body>
</html>
